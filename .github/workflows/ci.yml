name: CI

on:
  pull_request:
    branches: [development, deployment]
  push:
    branches: [development, deployment]
  workflow_dispatch:
    inputs:
      operation:
        description: deploy applies tested code and preserves database data. reset-database permanently wipes and recreates the database.
        required: true
        type: choice
        options:
          - deploy
          - reset-database
        default: deploy
      confirm_database_reset:
        description: Type DELETE_DATABASE to authorize permanent database deletion
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gui-smoke:
    name: Patient and staff GUI smoke tests
    if: github.event_name != 'workflow_dispatch' || inputs.operation != 'reset-database'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install repository dependencies
        run: npm ci

      - name: Install mobile dependencies for fork coverage
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: npm ci --prefix mds-mobile

      - name: Run coverage on fork pull requests
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: npm run test:coverage

      - name: Build patient and staff portals
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run GUI smoke tests
        run: npm run test:gui

      - name: Upload GUI failure traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gui-smoke-traces
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  test-and-build:
    needs: gui-smoke
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 45
    outputs:
      image_id: ${{ steps.build-image.outputs.image_id }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install repository dependencies
        run: npm ci

      - name: Install mobile dependencies
        run: npm ci --prefix mds-mobile

      - name: Run application tests for manual Pi operations
        if: github.event_name == 'workflow_dispatch'
        run: npm test -- --selectProjects backend patient staff mobile

      - name: Build patient and staff portals
        run: npm run build

      - name: Validate Compose configuration
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: mdsystem_ci
          REDIS_PASSWORD: ci-only-password
          SCHEMA_SQL_PATH: /tmp/ci-schema.psql
        run: docker compose config --quiet

      - name: Build Docker image
        id: build-image
        if: github.event_name != 'workflow_dispatch' || inputs.operation == 'deploy'
        run: |
          # Keep the exact ID even if another run replaces the mdsystem:ci tag.
          image_id_file="$RUNNER_TEMP/mdsystem-ci-image-id"
          docker build --target runtime --build-arg SOURCE_REVISION="$GITHUB_SHA" \
            --tag mdsystem:ci --iidfile "$image_id_file" .
          image_id=$(cat "$image_id_file")
          echo "image_id=$image_id" >> "$GITHUB_OUTPUT"

      - name: Run coverage and disposable Playwright core tests
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        env:
          E2E_CONFIG_PATH: /srv/projects/MDSystem/e2e.private.env
          E2E_STATE_DIR: ${{ runner.temp }}/mdsystem-e2e-${{ github.run_id }}-${{ github.run_attempt }}
        run: npm run test:all

      - name: Upload disposable Playwright core report
        if: always() && (github.event_name == 'push' || github.event_name == 'pull_request')
        uses: actions/upload-artifact@v7
        with:
          name: playwright-core-${{ github.sha }}
          path: e2e-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove registered interrupted E2E projects
        if: always() && (github.event_name == 'push' || github.event_name == 'pull_request')
        env:
          E2E_STATE_DIR: ${{ runner.temp }}/mdsystem-e2e-${{ github.run_id }}-${{ github.run_attempt }}
        run: node scripts/e2e-cleanup.js --registered

  deploy-pi:
    name: Apply operation on the Pi
    needs: [gui-smoke, test-and-build]
    # Manual resets reuse the installed image. All code deployments require successful checks.
    if: >-
      !cancelled() && (
        (github.event_name == 'workflow_dispatch' && inputs.operation == 'reset-database') ||
        (needs.gui-smoke.result == 'success' && needs.test-and-build.result == 'success' && (
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy')
        ))
      )
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: /srv/projects/MDSystem
    env:
      MD_SYSTEM_IMAGE: mdsystem
      IMAGE_TAG: local
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Validate manual Pi operation
        if: github.event_name == 'workflow_dispatch'
        env:
          OPERATION: ${{ inputs.operation }}
          RESET_CONFIRMATION: ${{ inputs.confirm_database_reset }}
        run: |
          if [[ "$GITHUB_REF" != refs/heads/* ]]; then
            echo "Select a branch under Use workflow from to run a manual Pi operation." >&2
            exit 1
          fi
          if [ "$OPERATION" = "reset-database" ] && [ "$RESET_CONFIRMATION" != "DELETE_DATABASE" ]; then
            echo "Database reset not authorized. Enter DELETE_DATABASE in the confirmation field." >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Tag the tested image for Pi deployment
        id: tag-tested-image
        if: github.event_name == 'push' || inputs.operation == 'deploy'
        env:
          CI_IMAGE_ID: ${{ needs.test-and-build.outputs.image_id }}
        run: docker image tag "$CI_IMAGE_ID" mdsystem:local

      - name: Deploy tested image to Pi (preserve database)
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/development') ||
          (github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy')
        run: node "$GITHUB_WORKSPACE/scripts/compose.js" up -d --no-build --no-deps --force-recreate patient staff email-worker

      - name: Reset Pi database, rerun SQL, and start services
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/deployment') ||
          (github.event_name == 'workflow_dispatch' && inputs.operation == 'reset-database')
        run: |
          docker image inspect mdsystem:local >/dev/null
          node "$GITHUB_WORKSPACE/scripts/compose.js" down --remove-orphans
          for volume in mdsystem_postgres-data mdsystem_schema-state; do
            if docker volume inspect "$volume" >/dev/null 2>&1; then
              docker volume rm "$volume"
            fi
          done
          node "$GITHUB_WORKSPACE/scripts/compose.js" up -d postgres redis
          node "$GITHUB_WORKSPACE/scripts/compose.js" --profile setup run --rm schema-init
          node "$GITHUB_WORKSPACE/scripts/compose.js" up -d --no-build patient staff email-worker

      - name: Check Pi service health
        run: |
          node "$GITHUB_WORKSPACE/scripts/compose.js" ps
          patient_ok=1
          staff_ok=1
          curl --fail --silent --show-error --retry-all-errors --retry 12 --retry-delay 5 --retry-max-time 120 http://127.0.0.1:3000/ >/dev/null || patient_ok=0
          curl --fail --silent --show-error --retry-all-errors --retry 12 --retry-delay 5 --retry-max-time 120 http://127.0.0.1:3001/ >/dev/null || staff_ok=0
          if [ "$patient_ok" -eq 0 ] || [ "$staff_ok" -eq 0 ]; then
            node "$GITHUB_WORKSPACE/scripts/compose.js" logs --tail=100 patient staff email-worker
            exit 1
          fi

      - name: Verify deployed image revision
        if: steps.tag-tested-image.outcome == 'success'
        run: |
          node "$GITHUB_WORKSPACE/scripts/verify-image-revision.js" "$GITHUB_SHA" \
            "patient=$(docker compose ps -q patient)" "staff=$(docker compose ps -q staff)"
