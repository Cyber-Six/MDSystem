name: CI

on:
  pull_request:
    branches: [development, docker-testing, deployment]
  push:
    branches: [development, docker-testing, deployment]
  workflow_dispatch:
    inputs:
      operation:
        description: Action to perform on the Pi use-case environment
        required: true
        type: choice
        options:
          - restart
          - reset-database
        default: restart
      confirm_database_reset:
        description: Type DELETE_DATABASE to authorize permanent database deletion
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gui-smoke:
    name: Patient and staff GUI smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install repository dependencies
        run: npm ci

      - name: Build patient and staff portals
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run GUI smoke tests
        run: npm run test:gui

      - name: Upload GUI failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gui-smoke-traces
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  test-and-build:
    needs: gui-smoke
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install repository dependencies
        run: npm ci

      - name: Install mobile dependencies
        run: npm ci --prefix mds-mobile

      - name: Run backend tests
        run: npm run test:backend

      - name: Run patient portal tests
        run: npm run test:patient

      - name: Run staff portal tests
        run: npm run test:staff

      - name: Run mobile tests
        run: npm run test:mobile

      - name: Build patient and staff portals
        run: npm run build

      - name: Validate Compose configuration
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: mdsystem_ci
          REDIS_PASSWORD: ci-only-password
          SCHEMA_SQL_PATH: /tmp/ci-schema.psql
        run: docker compose config --quiet

      - name: Build Docker image
        run: docker build --target runtime --tag mdsystem:ci .

      - name: Validate manual operation selection
        if: github.event_name == 'workflow_dispatch'
        env:
          OPERATION: ${{ inputs.operation }}
          RESET_CONFIRMATION: ${{ inputs.confirm_database_reset }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/docker-testing" ]; then
            echo "Manual Pi operations must be run from the docker-testing branch." >&2
            exit 1
          fi
          if [ "$OPERATION" = "reset-database" ] && [ "$RESET_CONFIRMATION" != "DELETE_DATABASE" ]; then
            echo "Database reset not authorized. Enter DELETE_DATABASE in the confirmation field." >&2
            exit 1
          fi

      - name: Deploy tested image to the Pi use-case stack
        if: github.event_name == 'push' && github.ref == 'refs/heads/docker-testing'
        working-directory: /srv/projects/MDSystem
        run: |
          docker image tag mdsystem:ci mdsystem:local
          node "$GITHUB_WORKSPACE/scripts/compose.js" up -d --no-build --no-deps --force-recreate patient staff email-worker
          node "$GITHUB_WORKSPACE/scripts/compose.js" ps
          patient_ok=1
          staff_ok=1
          curl --fail --silent --show-error --retry-all-errors --retry 12 --retry-delay 5 --retry-max-time 120 http://127.0.0.1:3000/ >/dev/null || patient_ok=0
          curl --fail --silent --show-error --retry-all-errors --retry 12 --retry-delay 5 --retry-max-time 120 http://127.0.0.1:3001/ >/dev/null || staff_ok=0
          if [ "$patient_ok" -eq 0 ] || [ "$staff_ok" -eq 0 ]; then
            node "$GITHUB_WORKSPACE/scripts/compose.js" logs --tail=100 patient staff email-worker
            exit 1
          fi

      - name: Manually restart the Pi use-case services
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'restart'
        working-directory: /srv/projects/MDSystem
        run: |
          docker image tag mdsystem:ci mdsystem:local
          node "$GITHUB_WORKSPACE/scripts/compose.js" up -d --no-build --no-deps --force-recreate patient staff email-worker
          node "$GITHUB_WORKSPACE/scripts/compose.js" ps
          patient_ok=1
          staff_ok=1
          curl --fail --silent --show-error --retry-all-errors --retry 12 --retry-delay 5 --retry-max-time 120 http://127.0.0.1:3000/ >/dev/null || patient_ok=0
          curl --fail --silent --show-error --retry-all-errors --retry 12 --retry-delay 5 --retry-max-time 120 http://127.0.0.1:3001/ >/dev/null || staff_ok=0
          if [ "$patient_ok" -eq 0 ] || [ "$staff_ok" -eq 0 ]; then
            node "$GITHUB_WORKSPACE/scripts/compose.js" logs --tail=100 patient staff email-worker
            exit 1
          fi

      - name: Manually reset database, rerun SQL, and start services
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'reset-database'
        working-directory: /srv/projects/MDSystem
        run: |
          node "$GITHUB_WORKSPACE/scripts/compose.js" stop patient staff email-worker postgres
          for volume in mdsystem_postgres-data mdsystem_schema-state; do
            if docker volume inspect "$volume" >/dev/null 2>&1; then
              docker volume rm "$volume"
            fi
          done
          docker image tag mdsystem:ci mdsystem:local
          node "$GITHUB_WORKSPACE/scripts/compose.js" up -d postgres redis
          node "$GITHUB_WORKSPACE/scripts/compose.js" --profile setup run --rm schema-init
          node "$GITHUB_WORKSPACE/scripts/compose.js" up -d --no-build patient staff email-worker
          node "$GITHUB_WORKSPACE/scripts/compose.js" ps
          patient_ok=1
          staff_ok=1
          curl --fail --silent --show-error --retry-all-errors --retry 12 --retry-delay 5 --retry-max-time 120 http://127.0.0.1:3000/ >/dev/null || patient_ok=0
          curl --fail --silent --show-error --retry-all-errors --retry 12 --retry-delay 5 --retry-max-time 120 http://127.0.0.1:3001/ >/dev/null || staff_ok=0
          if [ "$patient_ok" -eq 0 ] || [ "$staff_ok" -eq 0 ]; then
            node "$GITHUB_WORKSPACE/scripts/compose.js" logs --tail=100 patient staff email-worker
            exit 1
          fi
