<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/MDSystem.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MDSystem - Patient Portal</title>
    <!-- Google reCAPTCHA v2 -->
    <script src="https://www.google.com/recaptcha/api.js?render=explicit" async defer></script>
    <!-- Google Identity Services (OAuth Sign-In) -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <!-- Theme initialization to prevent flash of unstyled content -->
    <script>
      (function() {
        const themeMode = localStorage.getItem('patient_themeMode') || 'system';
        if (themeMode === 'dark') {
          document.documentElement.classList.add('dark');
        } else if (themeMode === 'system') {
          if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
