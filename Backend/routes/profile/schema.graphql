# Shared base profile
interface userProfile{
  id: ID!
  first_name: String!
  middle_name: String!
  last_name: String!
  suffix: String!
  date_of_birth: Date!
  sex: USER_SEX!
  status: USER_CIVILSTATUS!
  religion: String!
  contactNumber: String!
  present_address: String!
  province_address: String!
  email: String!
}

# Student profile
type StudentProfile {
  id: ID!
  profile: userProfile!   # FK reference
  program: String!
  year: STUDENT_YEAR!
  guardianName: String!
  guardianRelation: String!
  guardianContact: String!
}

# Employee profile
type EmployeeProfile {
  id: ID!
  profile: ProfileRecord!   # FK reference
  department: String!
  role: String!
  position: String!
}

# Enums for controlled vocabularies
enum StudentYear {
  FRESHMAN
  SOPHOMORE
  JUNIOR
  SENIOR
}

enum EmployeeRole {
  DOCTOR
  NURSE
  ADMIN
  STAFF
}

# Queries
type Query {
  # Student queries
  getStudentProfile(id: ID!): StudentProfile
  listStudentProfiles: [StudentProfile]

  # Employee queries
  getEmployeeProfile(id: ID!): EmployeeProfile
  listEmployeeProfiles: [EmployeeProfile]
}

# Mutations
type Mutation {
  # Student mutations
  createStudentProfile(
    profileId: ID!
    program: String!
    year: StudentYear!
    guardianName: String
    guardianRelation: String
    guardianContact: String
  ): StudentProfile

  # Employee mutations
  createEmployeeProfile(
    profileId: ID!
    department: String!
    role: EmployeeRole!
    position: String!
  ): EmployeeProfile
}
