scalar Date


enum USER_SEX {
    Male
    Female
}

enum USER_CIVILSTATUS {
    Single
    Married
    Widowed
    Divorced
    Separated
}

enum USER_BRANCH {
  Manila
  QuezonCity
  Both
}

type userProfile{
  id: ID!
  first_name: String!
  middle_name: String!
  last_name: String!
  suffix: String
  date_of_birth: Date!
  sex: USER_SEX!
  civil_status: USER_CIVILSTATUS!
  nationality: String!
  religion: String!
  contactNumber: String!
  present_address: String!
  province_address: String!
  status: UpdateStatus!
  identity: UserIdentity!
  email: String
  branch: USER_BRANCH
  identifier: ID
  updated_at: Date
  created_at: Date
}

input userProfileInitialInput{
  first_name: String!
  middle_name: String!
  last_name: String!
  suffix: String
  date_of_birth: Date!
  sex: USER_SEX!
  civil_status: USER_CIVILSTATUS!
  nationality: String!
  religion: String!
  contactNumber: String!
  present_address: String!
  province_address: String!
  branch: USER_BRANCH!
  identifier: ID!
}

input userProfileInput{
  first_name: String!
  middle_name: String!
  last_name: String!
  suffix: String
  date_of_birth: Date!
  sex: USER_SEX!
  civil_status: USER_CIVILSTATUS!
  nationality: String!
  religion: String!
  contactNumber: String!
  present_address: String!
  province_address: String!
}

input userProfileUpdateInput{
  first_name: String
  middle_name: String
  last_name: String
  suffix: String
  date_of_birth: Date
  sex: USER_SEX!
  civil_status: USER_CIVILSTATUS
  nationality: String
  religion: String
  contactNumber: String
  present_address: String
  province_address: String
}

enum UpdateStatus{
    InProgress
    Pending
    Revision
    RevisionSubmitted
    Expired
    Cancelled
    Approved
}

enum CredentialStatus{
  Unverified
  Active
  Inactive
  Locked
}

enum UserIdentity {
  Student
  Employee
}

type UserCredentials {
  id: ID!
  identity: UserIdentity!
  email: String!
  status: CredentialStatus!
  data_consent: Boolean!
  locked_until: Date
  last_login: Date
  created_at: Date
}

# Queries
type Query {
  # Student queries
  getCredentialStatus: String # get is unverified or not
  getUserCredentialStatus(userId: ID!): String

  getPersonalRecord: userProfile # get the main record of the logged in user 
  getUserPersonalRecord(userId: ID!): userProfile

  getPersonalRecordLogStatus: String # get the update status of the logged in user
  getUserPersonalRecordLogStatus(userId: ID!): String

  getPersonalRecordLog: userProfile
  getUserPersonalRecordLog(userId: ID!, from: Date, offset: Int, limit: Int): [userProfile!]

  getLoginEmail: String # returns the user's login email from UserCredentials (works before initial record is submitted)
  getUserLoginCredentials(userId: ID!): UserCredentials
}

# Mutations
type Mutation {
  createInitialPersonalRecord(input: userProfileInitialInput!): userProfile
  createPersonalRecordLog(input: userProfileInput!): userProfile
  # createPersonalRecordLog for patient pr creation, while updatePersonalRecordLog for patient pr update
  # while updatePatientPersonalRecordLog for patient pr update
  updatePatientPersonalRecordLog(input: userProfileUpdateInput!): userProfile

  updatePersonalRecordLog(userId: ID!, input: userProfileUpdateInput!): userProfile

  setPersonalRecordLog(userId: ID!, status: UpdateStatus!): UpdateStatus
  cancelPersonalRecordLog: String

  reloadCredentialStatus: String
  reloadUserCredentialStatus(userId: ID!): String
  
  staffSetCredentialStatus(userId: ID!, status: CredentialStatus!): CredentialStatus
  staffSetBranchIdentifier(userId: ID!, identifier: String!, branch: USER_BRANCH!): Boolean


}
