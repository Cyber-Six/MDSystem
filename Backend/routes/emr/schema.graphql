enum STUDENT_YEAR {
    Grade11
    Grade12
    Freshman
    Sophomore
    Junior
    Senior
    Masteral
    Doctorate
}


## Student profile & Employee profile types

interface UserProfile{
  id: ID
  }


type StudentProfile implements UserProfile {
  id: ID!
  program: String!
  year: STUDENT_YEAR!
  guardian_name: String!
  guardian_relation: String!
  guardian_contact: String!
  status: UpdateStatus! 
  archived_at: Date
  created_at: Date
}

type EmployeeProfile implements UserProfile {
  id: ID!
  department: String!
  role: String!
  position: String!
  status: UpdateStatus! 
  archived_at: Date
  created_at: Date!
}

input StudentProfileInput{
  program: String!
  year: STUDENT_YEAR!
  guardian_name: String!
  guardian_relation: String!
  guardian_contact: String!
}

input EmployeeProfileInput {
  department: String!
  role: String!
  position: String!
}

input StudentProfileUpdateInput{
  program: String 
  year: STUDENT_YEAR
  guardian_name: String
  guardian_relation: String
  guardian_contact: String
}

input EmployeeProfileUpdateInput {
  department: String
  role: String
  position: String
}

