    diagnosedDate: Date
    relationship: String
}

type MedicalHistory {
    id: ID!
    conditions: [MedicalHistoryCondition!]
    archived_at: Date
}

type MedicalCondition{
    id: ID!
    name: String!
    description: String
    isActive: Boolean!
    created_at: Date
}

type DentalHistory {
    id: ID!

    seenByDentist: Boolean!
    lastDentalCleaning: String!
