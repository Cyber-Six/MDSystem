enum UpdateScope{
    Medical
    Dental
    Both
}

enum UpdateStatus{
    Inprogress
    Pending
    Revised
    Cancelled
    Approved
}


union userProfile = StudentProfile | EmployeeProfile

# Queries
type Query {
  # Mescilanous 


  # Categories
  getProfile: userProfile
  getUserProfile(id: ID!, from: Date, to: Date, offset: Int, limit: Int, scope: UpdateScope, statuses: [UpdateStatus]): [userProfile!]! # diffenent resolver for patient vs staff

  getDentalPhotos: dentalPhotos
  getUserDentalPhotos(id: ID!, from: Date, to: Date, offset: Int, limit: Int, scope: UpdateScope, statuses: [UpdateStatus]): [dentalPhotos!]! 

  getObgynHistory: ObgynHistory  
  getUserObgynHistory(id: ID!, from: Date, to: Date, offset: Int, limit: Int, scope: UpdateScope, statuses: [UpdateStatus]): [ObgynHistory!]!
  
  getLifestyle: Lifestyle
  getUserLifestyle(id: ID!, from: Date, to: Date, offset: Int, limit: Int, scope: UpdateScope, statuses: [UpdateStatus]): [Lifestyle!]!

  getDentalHistory: DentalHistory
  getUserDentalHistory(id: ID!, from: Date, to: Date, offset: Int, limit: Int, scope: UpdateScope, statuses: [UpdateStatus]): [DentalHistory!]!

  getDentalRecord: DentalRecord
  getUserDentalRecord(id: ID!, from: Date, to: Date, offset: Int, limit: Int, scope: UpdateScope, statuses: [UpdateStatus]): [DentalRecord!]!

  getVitalSigns: VitalSigns
  getUserVitalSigns(id: ID!, from: Date, to: Date, offset: Int, limit: Int, scope: UpdateScope, statuses: [UpdateStatus]): [VitalSigns!]!

  getOralApplianceProfile: OralApplianceProfile
  getUserOralApplianceProfile(id: ID!, from: Date, to: Date, offset: Int, limit: Int, scope: UpdateScope, statuses: [UpdateStatus]): [OralApplianceProfile!]!

  getEmergencyContact: EmergencyContact
  getUserEmergencyContact(id: ID!, from: Date, to: Date, offset: Int, limit: Int, scope: UpdateScope, statuses: [UpdateStatus]): [EmergencyContact!]!

  getAllergyProfile: AllergyProfile
  getUserAllergyProfile(id: ID!, from: Date, to: Date, offset: Int, limit: Int, scope: UpdateScope, statuses: [UpdateStatus]): [AllergyProfile!]!

  getMedicationProfile: MedicationProfile
  getUserMedicationProfile(id: ID!, from: Date, to: Date, offset: Int, limit: Int, scope: UpdateScope, statuses: [UpdateStatus]): [MedicationProfile!]!

  getDentalProcedureProfile: DentalProcedureProfile
  getUserDentalProcedureProfile(id: ID!, from: Date, to: Date, offset: Int, limit: Int, scope: UpdateScope, statuses: [UpdateStatus]): [DentalProcedureProfile!]!

  getImmunizationProfile: ImmunizationProfile
  getUserImmunizationProfile(id: ID!, from: Date, to: Date, offset: Int, limit: Int, scope: UpdateScope, statuses: [UpdateStatus]): [ImmunizationProfile!]!

  getOperationProfile: OperationProfile
  getUserOperationProfile(id: ID!, from: Date, to: Date, offset: Int, limit: Int, scope: UpdateScope, statuses: [UpdateStatus]): [OperationProfile!]!
  
  getHospitalizationProfile: HospitalizationProfile
  getUserHospitalizationProfile(id: ID!, from: Date, to: Date, offset: Int, limit: Int, scope: UpdateScope, statuses: [UpdateStatus]): [HospitalizationProfile!]!

  getMedicalHistory: MedicalHistory
  getUserMedicalHistory(id: ID!, from: Date, to: Date, offset: Int, limit: Int, scope: UpdateScope, statuses: [UpdateStatus]): [MedicalHistory!]!

  getVisualAcuityProfile: VisualAcuityProfile
  getUserVisualAcuityProfile(id: ID!, from: Date, to: Date, offset: Int, limit: Int, scope: UpdateScope, statuses: [UpdateStatus]): [VisualAcuityProfile!]!
  
  # miscellaneous
  getConditionDomain: [String!]!
  getprocedureDomain: [String!]! 
  getDomainCatalogs(domain: String, isValid: Boolean, offset: Int, limit: Int): [DomainCatalog!]!
  getAllergenCatalogs(type: ALLERGEN_TYPE, isValid: Boolean, offset: Int, limit: Int): [AllergenCatalog!]!


}

# Mutations
type Mutation {
  # Profile
  createStudentProfile(input: StudentProfileInput!): userProfile!
  createEmployeeProfile(input: EmployeeProfileInput!): userProfile!

  updateStudentProfile(id: ID!, input: StudentProfileUpdateInput!): userProfile!
  updateEmployeeProfile(id: ID!, input: EmployeeProfileUpdateInput!): userProfile!

  # Dental Photos
  createDentalPhotos(input: dentalPhotosInput!): dentalPhotos!
  updateDentalPhotos(id: ID!, input: dentalPhotosUpdateInput!): dentalPhotos!

  # Obgyn History
  createObgynHistory(input: ObgynHistoryInput!): ObgynHistory!
  updateObgynHistory(id: ID!, input: ObgynHistoryUpdateInput!): ObgynHistory!

  getLifestyle(input: LifestyleInput!): Lifestyle!
  updateLifestyle(id: ID!, input: LifestyleUpdateInput!): Lifestyle!

  createDentalHistory(input: DentalHistoryInput!): DentalHistory!
  updateDentalHistory(id: ID!, input: DentalHistoryUpdateInput!): DentalHistory!

  createDentalRecord(input: DentalRecordInput!): DentalRecord!
  updateDentalRecord(id: ID!, input: DentalRecordUpdateInput!): DentalRecord!

  createVitalSigns(input: VitalSignsInput!): VitalSigns!
  updateVitalSigns(id: ID!, input: VitalSignsUpdateInput!): VitalSigns!

  createOralApplianceProfile(input: OralApplianceProfileInput!): OralApplianceProfile!
  updateOralApplianceProfile(id: ID!, input: OralApplianceProfileUpdateInput!): OralApplianceProfile!

  createEmergencyContact(input: EmergencyContactInput!): EmergencyContact!
  updateEmergencyContact(id: ID!, input: EmergencyContactInput!): EmergencyContact!

  createAllergyProfile(input: AllergyProfileInput!): AllergyProfile!
  updateAllergyProfile(id: ID!, input: AllergyProfileUpdateInput!): AllergyProfile

  createMedicationProfile(input: MedicationProfileInput!): MedicationProfile!
  updateMedicationProfile(id: ID!, input: MedicationProfileInput!): MedicationProfile!

  createDentalProcedureProfile(input: DentalProcedureProfileInput!): DentalProcedureProfile!
  updateDentalProcedureProfile(id: ID!, input: DentalProcedureProfileInput!): DentalProcedureProfile!

  createImmunizationProfile(input: ImmunizationProfileInput!): ImmunizationProfile!
  updateImmunizationProfile(id: ID!, input: ImmunizationProfileInput!): ImmunizationProfile!

  createOperationProfile(input: OperationProfileInput!): OperationProfile!
  updateOperationProfile(id: ID!, input: OperationProfileInput!): OperationProfile!

  createHospitalizationProfile(input: HospitalizationProfileInput!): HospitalizationProfile!
  updateHospitalizationProfile(id: ID!, input: HospitalizationProfileInput!): HospitalizationProfile!

  createMedicalHistory(input: MedicalHistoryInput!): MedicalHistory!
  updateMedicalHistory(id: ID!, input: MedicalHistoryInput!): MedicalHistory!

  createVisualAcuityProfile(input: VisualAcuityProfileInput!): VisualAcuityProfile!
  updateVisualAcuityProfile(id: ID!, input: VisualAcuityProfileUpdateInput!): VisualAcuityProfile!
}
  