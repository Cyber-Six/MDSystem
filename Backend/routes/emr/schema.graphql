
#====================== USER PROFILE SCHEMA ==================== ###

enum USER_SEX {
    Male
    Female
}

enum USER_CIVILSTATUS {
    Single
    Married
    Widowed
    Separated
}

interface userProfile{
  id: ID!
  first_name: String!
  middle_name: String!
  last_name: String!
  suffix: String!
  date_of_birth: Date!
  sex: USER_SEX!
  status: USER_CIVILSTATUS!
  religion: String!
  contactNumber: String!
  present_address: String!
  province_address: String!
  email: String!
}

enum STUDENT_YEAR {
    Grade11
    Grade12
    Freshman
    Sophomore
    Junior
    Senior
    Masteral
    Doctorate
}

type StudentProfile implements userProfile {
  id: ID!
  profile: userProfile!   # FK reference
  program: String!
  year: STUDENT_YEAR!
  guardianName: String!
  guardianRelation: String!
  guardianContact: String!
}

type EmployeeProfile implements userProfile {
  id: ID!
  profile: userProfile!   # FK reference
  department: String!
  role: String!
  position: String!
}

