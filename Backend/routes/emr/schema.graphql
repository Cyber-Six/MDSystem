## -------- Patient Search -------- ##

type PatientSearchResult {
  id: ID!
  identifier: String
  branch: DesignationBranch
  sex: String
  first_name: String
  last_name: String
  middle_name: String
  suffix: String
  profile_type: String
  program: String
  year: String
  department: String
  role: String
  latest_ticket_id: ID
  latest_status: UpdateStatus
  latest_scope: UpdateScope
  latest_updated_at: Date
}


enum DesignationBranch{
  Manila
  QuezonCity
  Both
}

enum DomainType {
  VisualAcuity
  MedicalCondition
  Medication
  Hospitalization
  Operation
  Immunization
  DentalProcedure
}
# Queries
type Query {
  # Miscellaneous 

  getUpdateTicket: UpdateTicket
  getUserUpdateTicket(userId: ID!): UpdateTicket

  getUserIDViaEntityId(entityId: String!, branch: DesignationBranch!): [UserProfile!]
  getUserIdViaName(Name: String!, branch: DesignationBranch!): [UserProfile!]
  getUserIdViaEmail(email: String!, branch: DesignationBranch!): [UserProfile!]

  # Patient Search (real-time, medical staff only)
  searchPatients(searchTerm: String!, branch: DesignationBranch, offset: Int, limit: Int): [PatientSearchResult!]!
  getPatientBasicInfo(userId: ID!): PatientSearchResult


  # Categories
  getProfile: UserProfile
  getUserProfile(userId: ID!, from: Date, offset: Int, limit: Int): [UserProfile!]

  getDentalPhotoRecord: DentalPhotoRecord
  getUserDentalPhotoRecord(userId: ID!, from: Date, offset: Int, limit: Int): [DentalPhotoRecord!]

  getObgynHistory: ObgynHistory 
  getUserObgynHistory(userId: ID!, from: Date, offset: Int, limit: Int): [ObgynHistory!] # for medical
  
  getLifestyle: Lifestyle
  getUserLifestyle(userId: ID!, from: Date, offset: Int, limit: Int): [Lifestyle!]

  getDentalHistory: DentalHistory
  getUserDentalHistory(userId: ID!, from: Date, offset: Int, limit: Int): [DentalHistory!]

  getDentalRecord: DentalRecord
  getUserDentalRecord(userId: ID!, from: Date, offset: Int, limit: Int): [DentalRecord!]

  getVitalSigns: VitalSigns
  getUserVitalSigns(userId: ID!, from: Date, offset: Int, limit: Int): [VitalSigns!]

  getOralApplianceProfile: OralApplianceProfile
  getUserOralApplianceProfile(userId: ID!, from: Date, offset: Int, limit: Int): [OralApplianceProfile!]

  getEmergencyContact: EmergencyContact
  getUserEmergencyContact(userId: ID!, from: Date, offset: Int, limit: Int): [EmergencyContact!]

  getAllergyProfile: AllergyProfile
  getUserAllergyProfile(userId: ID!, from: Date, offset: Int, limit: Int): [AllergyProfile!]

  getMedicationProfile: MedicationProfile
  getUserMedicationProfile(userId: ID!, from: Date, offset: Int, limit: Int): [MedicationProfile!]

  getDentalProcedureProfile: DentalProcedureProfile
  getUserDentalProcedureProfile(userId: ID!, from: Date, offset: Int, limit: Int): [DentalProcedureProfile!]

  getImmunizationProfile: ImmunizationProfile
  getUserImmunizationProfile(userId: ID!, from: Date, offset: Int, limit: Int): [ImmunizationProfile!]

  getOperationProfile: OperationProfile
  getUserOperationProfile(userId: ID!, from: Date, offset: Int, limit: Int): [OperationProfile!]
  
  getHospitalizationProfile: HospitalizationProfile
  getUserHospitalizationProfile(userId: ID!, from: Date, offset: Int, limit: Int): [HospitalizationProfile!]

  getMedicalHistory: MedicalHistory
  getUserMedicalHistory(userId: ID!, from: Date, offset: Int, limit: Int): [MedicalHistory!]

  getVisualAcuityProfile: VisualAcuityProfile
  getUserVisualAcuityProfile(userId: ID!, from: Date, offset: Int, limit: Int): [VisualAcuityProfile!]
  
  # miscellaneous

  getProcedureDomain: [DomainType!]
  # get the list of procedure domain available

  getDomainCatalogs(domain: DomainType, filterIsValid: Boolean, offset: Int, limit: Int): [DomainCatalog!]
  getAllergenCatalogs(type: ALLERGEN_TYPE, filterIsValid: Boolean, offset: Int, limit: Int): [AllergenCatalog!]
  getOralApplianceCatalogs(filterIsValid: Boolean, offset: Int, limit: Int): [OralApplianceTag!]
  getOralFindingCatalogs(filterIsValid: Boolean, offset: Int, limit: Int): [OralFindingCatalog!]
  # render the list of options per catalog


  getStatusUpdateTickets(statuses: [UpdateStatus!]!, branch: DesignationBranch!, offset: Int, limit: Int): [UpdateTicket!]
  # fetch all latest ticket of users

  searchDomainCatalogs(domain: String, filterIsValid: Boolean, names: [String!]!): [DomainCatalog!]
  searchAllergenCatalogs(allergens: [String!]!, filterIsValid: Boolean): [AllergenCatalog!]
  searchOralApplianceCatalogs(names: [String!]!, filterIsValid: Boolean): [OralApplianceTag!]
}

# Mutations
type Mutation {
  # Profile

  createUpdateTicket(scope: UpdateScope!): ID

  submitUpdateTicket: UpdateStatus
  cancelUpdateTicket: UpdateStatus

  staffUpdateTicket(userId: ID!, status: UpdateStatus!, notes: String): UpdateStatus
  

  createStudentProfile(input: StudentProfileInput!): StudentProfile # for patients
  createEmployeeProfile(input: EmployeeProfileInput!): EmployeeProfile

  updateStudentProfile(userId: ID!, input: StudentProfileUpdateInput!): StudentProfile # for medical
  updateEmployeeProfile(userId: ID!, input: EmployeeProfileUpdateInput!): EmployeeProfile
  # Dental Photos
  createDentalPhotoRecord(input: DentalPhotoRecordInput!): DentalPhotoRecord
  updateDentalPhotoRecord(userId: ID!, input: DentalPhotoRecordUpdateInput!): DentalPhotoRecord
  # Obgyn History
  createObgynHistory(input: ObgynHistoryInput!): ObgynHistory
  updateObgynHistory(userId: ID!, input: ObgynHistoryUpdateInput!): ObgynHistory

  createLifestyle(input: LifestyleInput!): Lifestyle
  updateLifestyle(userId: ID!, input: LifestyleUpdateInput!): Lifestyle

  createDentalHistory(input: DentalHistoryInput!): DentalHistory
  updateDentalHistory(userId: ID!, input: DentalHistoryUpdateInput!): DentalHistory

  updateDentalRecord(userId: ID!, input: DentalRecordInput!): DentalRecord
  updateVitalSigns(userId: ID!, input: VitalSignsUpdateInput!): VitalSigns

  createOralApplianceProfile(input: OralApplianceProfileInput!): OralApplianceProfile
  updateOralApplianceProfile(userId: ID!, input: OralApplianceProfileInput!): OralApplianceProfile

  createEmergencyContact(input: EmergencyContactInput!): EmergencyContact
  updateEmergencyContact(userId: ID!, input: EmergencyContactInput!): EmergencyContact

  createAllergyProfile(input: AllergyProfileInput!): AllergyProfile
  updateAllergyProfile(userId: ID!, input: AllergyProfileUpdateInput!): AllergyProfile

  createMedicationProfile(input: MedicationProfileInput!): MedicationProfile
  updateMedicationProfile(userId: ID!, input: MedicationProfileInput!): MedicationProfile

  createDentalProcedureProfile(input: DentalProcedureProfileInput!): DentalProcedureProfile
  updateDentalProcedureProfile(userId: ID!, input: DentalProcedureProfileInput!): DentalProcedureProfile

  createImmunizationProfile(input: ImmunizationProfileInput!): ImmunizationProfile
  updateImmunizationProfile(userId: ID!, input: ImmunizationProfileInput!): ImmunizationProfile

  createOperationProfile(input: OperationProfileInput!): OperationProfile
  updateOperationProfile(userId: ID!, input: OperationProfileInput!): OperationProfile

  createHospitalizationProfile(input: HospitalizationProfileInput!): HospitalizationProfile
  updateHospitalizationProfile(userId: ID!, input: HospitalizationProfileInput!): HospitalizationProfile

  createMedicalHistory(input: MedicalHistoryInput!): MedicalHistory
  updateMedicalHistory(userId: ID!, input: MedicalHistoryInput!): MedicalHistory

  createVisualAcuityProfile(input: VisualAcuityProfileInput!): VisualAcuityProfile
  updateVisualAcuityProfile(userId: ID!, input: VisualAcuityProfileInput!): VisualAcuityProfile


  createDomainCatalogs(domain: DomainType!, names: [String!]!): [DomainCatalog!]!
  updateDomainCatalogs(catalogs: [DomainCatalogInput!]!): [DomainCatalog!]

  createAllergenCatalogs(allergens: [AllergenCatalogInput!]!): [AllergenCatalog!]!
  updateAllergenCatalogs(allergens: [AllergenCatalogUpdateInput!]!): [AllergenCatalog!]

  createOralApplianceCatalogs(appliances: [OralApplianceTagInput!]!): [OralApplianceTag!]!
  updateOralApplianceCatalogs(appliances: [OralApplianceTagUpdateInput!]!): [OralApplianceTag!]
}
  