enum UpdateScope{
    Medical
    Dental
    Both
}

enum UpdateStatus{
    In-progress
    Pending
    Revised
    Cancelled
    Approved
}
# Queries
type Query {
  getProfile(id: ID!, from: Date, to: Date, offset: Int, limit: Int): [userProfile] # diffenent resolver for patient vs staff
  getAllProfiles(from: Date, to: Date, offset: Int, limit: Int, scope: UpdateScope, statuses: [UpdateStatus]): [userProfile]!

  getDentalPhotos(id: ID!, from: Date, to: Date, offset: Int, limit: Int): dentalPhotos 
  getAllDentalPhotos(from: Date, to: Date, offset: Int, limit: Int, scope: UpdateScope, statuses: [UpdateStatus]): [dentalPhotos!]!
  
  
  getDentalHistory(id: ID!): DentalHistory
  getDentalRecord

}

