## Student profile & Employee profile types

interface UserProfile{
  id: ID
  }


type StudentProfile implements UserProfile {
  id: ID!
  program: String
  year: STUDENT_YEAR
  status: UpdateStatus
  archived_at: Date
  created_at: Date
}

type EmployeeProfile implements UserProfile {
  id: ID!
  department: String
  role: String
  position: String
  status: UpdateStatus
  archived_at: Date
  created_at: Date
}

input StudentProfileInput{
  program: String!
