}

input EmployeeProfileInput {
  department: String!
  role: String!
  position: String!
}

input StudentProfileUpdateInput{
  program: String 
  year: STUDENT_YEAR
}

input EmployeeProfileUpdateInput {
  department: String
  role: String
  position: String
}

