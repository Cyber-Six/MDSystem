## Student profile & Employee profile types
type StudentProfile {
  id: ID!
  program: String!
  year: STUDENT_YEAR!
  guardianName: String!
  guardianRelation: String!
  guardianContact: String!
  archived_at: Date

}

type EmployeeProfile {
  id: ID!
  department: String!
  role: String!
  position: String!
  archived_at: Date

}

input StudentProfileInput{
  program: String!
  year: STUDENT_YEAR!
  guardianName: String!
  guardianRelation: String!
  guardianContact: String!
}

input EmployeeProfileInput {
  department: String!
  role: String!
  position: String!
}

input StudentProfileUpdateInput{
  program: String 
  year: STUDENT_YEAR
  guardianName: String
  guardianRelation: String
  guardianContact: String
}

input EmployeeProfileUpdateInput {
