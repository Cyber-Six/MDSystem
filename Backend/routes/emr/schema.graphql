## -------- Dental Record-------- ##

type ToothLegend{
  id: ID!
  name: String!
  description: String
}

type ToothPlacement{ # singular tooth info
  id: ID!
  tooth_index: Int!
  legend: [ToothLegend]!
}

# Oral Finding
type OralFindingLegend{
  id: ID!
  name: String! # Calculus
  isActive: Boolean!
  description: String
}

type OralFinding{
  id: ID!
  oral: OralFindingLegend!
  status: Boolean!
  notes: String
  created_at: Date!
}


type DentalRecord{
    numberOfTeeth: Int!
    cariesForFilling: Int!
    cariesForExtraction: Int!
    rootFragment: Int!
    missingTeeth: Int!
    filled: Int!
    totalDMF: Int!
    notes: String

    oralFindings: [OralFinding!]!
    ToothPlacement: [ToothPlacement!]!
    created_at: Date!
}


# Intra Oral Appliance

enum oralApplianceArch {
  None
  Upper
  Lower
  Both
}

type OralApplianceLegend{
  id: ID!
  name: String!
  description: String
  archable: Boolean!
  isActive: Boolean!
  created_at: Date
}

type OralAppliance{
  id: ID!
  legend: OralApplianceLegend!
  status: String!
  dateIssued: Date!
  arch: oralApplianceArch!
}

type OralApplianceProfile{
  id: ID!
  appliances: [OralAppliance!]
  notes: String
  archived_at: Date!
}

## -------- Emergency Contact -------- ##

type EmergencyNumber {
    id: ID!
    name: String!
    relationship: String!
    contactNumber: String!
    isVerified: Boolean!
    created_at: Date!
}

type EmergencyContact {
    id: ID!
    firstContact: EmergencyNumber!
    secondContact: EmergencyNumber!
    archived_at: Date!

}

## Allergies

enum ALLERGEN_TYPE{
  Food
  Drug
  Environmental
  Insect
  Chemical
  Other
}

enum ALLERGY_STATUS{
  Active
  Resolved
  Suspected
}

type AllergenCatalog{
  id: ID!
  allergen: String!
  type: ALLERGEN_TYPE!
  isValid: Boolean!
  created_at: Date!
}

type AllergyRecord{
  id: ID!
  allergen: AllergenCatalog!
  status: ALLERGY_STATUS!
  severity: String!
  notes: String
  dateIdentified: Date
}

type AllergyProfile{
  id: ID!
  allergies: [AllergyRecord!]
  notes: String
  archived_at: Date
}

