# ===================== MEDICINE REQUEST SCHEMA ===================== #

scalar Date


enum UpdateStatus {
  InProgress
  Pending
  Revision
  RevisionSubmitted
  Cancelled
  Expired
  Approved
  Rejected
}

enum TransactionActionType {
  issue
  return
  adjust
}

enum DosageUnit {
  mg
  g
  mcg
  ml
  L
  IU
}

enum ItemCategory {
  medicine
  supply
  instrument
  equipment
}

enum LocationDesignation {
  Arlegui
  Casal
  QuezonCity
}

# ---- Types ---- #

type MedicineItem {
  id: ID!
  item_code: String
  item_name: String
  category: ItemCategory
  subcategory: String
  description: String
  reorder_level: Int
  active: Boolean
}

type MedicineBatch {
  id: ID!
  medicalItemId: Int!
  batchNumber: String
  dosageUnit: DosageUnit
  dosageValue: Int
  initialQuantity: Int
  currentQuantity: Int
  expiryDate: Date
  location: LocationDesignation
  item: MedicineItem
}

type MedicineRequestItem {
  id: ID!
  batchId: Int!
  requestId: Int!
  quantity: Int!
  batch: MedicineBatch
}

type MedicineRequest {
  id: ID!
  patientId: Int!
  status: UpdateStatus!
  transactionId: Int
  purpose: String
  approved_by: Int
  rejection_reason: String
  created_at: String
  items: [MedicineRequestItem]
}

type MedicineTransaction {
  id: ID!
  patientId: Int!
  action: TransactionActionType!
  quantity: Int!
  issuedBy: Int
  issuedAt: Date
  notes: String
}

# ---- Inputs ---- #

input MedicineRequestItemInput {
  batchId: Int!
  quantity: Int!
}

input CreateMedicineRequestInput {
  purpose: String!
  items: [MedicineRequestItemInput!]!
}

input UpdateMedicineRequestDataInput {
  requestId: Int!
  items: [MedicineRequestItemInput!]!
}

input ApproveMedicineRequestInput {
  requestId: Int!
  notes: String
}

# ---- Queries ---- #

type Query {
  # Patient
  getMyMedicineRequests(offset: Int, limit: Int): [MedicineRequest]
  getMyMedicineRequest(requestId: Int!): MedicineRequest
  getAvailableMedicines(offset: Int, limit: Int): [MedicineItem]
  getAvailableBatches(medicalItemId: Int!): [MedicineBatch]

  # Staff
  getMedicineRequests(status: UpdateStatus, offset: Int, limit: Int): [MedicineRequest]
  getMedicineRequest(requestId: Int!): MedicineRequest
  getMedicineItems(offset: Int, limit: Int): [MedicineItem]
  getMedicineBatches(medicalItemId: Int!): [MedicineBatch]
}

# ---- Mutations ---- #

type Mutation {
  # Patient
  createMedicineRequest(input: CreateMedicineRequestInput!): MedicineRequest
  cancelMedicineRequest(requestId: Int!): MedicineRequest

  # Staff
  updateMedicineRequestData(input: UpdateMedicineRequestDataInput!): MedicineRequest
  approveMedicineRequest(input: ApproveMedicineRequestInput!): MedicineRequest
  rejectMedicineRequest(requestId: Int!, reason: String): MedicineRequest
}
