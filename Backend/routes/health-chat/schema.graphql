scalar Date
scalar UUID

# Enums matching database
enum ChatStatus {
  Open
  Ongoing
  Closed
  Expired
}

enum PromptType {
  text
  file
  system
}

enum UserType {
  Patient
  Medical
}

enum ClosedBy {
  Patient
  Staff
  System
}

enum Designation {
  Manila
  QuezonCity
  Both
}

# Types
type HealthChat {
  id: ID!
  patientId: Int!
  medicalId: Int
  purpose: String!
  notes: String
  status: ChatStatus!
  session_start: Date
  session_end: Date
  consent_logged: Boolean
  archived_at: Date
  patient: ChatParticipant
  medical: ChatParticipant
  closedBy: ClosedBy
  messages: [HealthChatPrompt!]
  expiresAt: Date
  # NEW: For Messenger-style display
  lastMessage: HealthChatPrompt
  lastMessageAt: Date
  unreadCount: Int
}

type HealthChatPrompt {
  id: ID!
  consultationVirtualId: Int!
  text: String
  filename: UUID
  promptType: PromptType!
  userId: Int  # Nullable for system messages
  userType: UserType!
  stamp: Date!
  sender: ChatParticipant
}

type ChatParticipant {
  id: ID!
  firstName: String
  lastName: String
  email: String
  identifier: Int
  branch: String
  dateOfBirth: String
  sex: String
  role: String
}

type HealthChatList {
  chats: [HealthChat!]!
  total: Int!
}

# NEW: Patient conversation grouping (1 row per patient)
type PatientConversation {
  patientId: Int!
  patient: ChatParticipant!
  latestTicket: HealthChat!
  lastMessage: HealthChatPrompt
  lastMessageAt: Date
  unreadCount: Int
  activeTicketCount: Int
  totalTicketCount: Int
  tickets: [HealthChat!]!
}

type PatientConversationList {
  conversations: [PatientConversation!]!
  total: Int!
}

type MessageResult {
  success: Boolean!
  message: HealthChatPrompt
}

type TicketResult {
  success: Boolean!
  chat: HealthChat
  message: String
}

# Input types
input CreateTicketInput {
  purpose: String!
  notes: String
}

input SendMessageInput {
  chatId: ID!
  text: String
  filename: UUID
  promptType: PromptType!
}

input ApproveTicketInput {
  chatId: ID!
  notes: String
}

input CloseTicketInput {
  chatId: ID!
  notes: String
}

# Patient-only queries
type PatientQuery {
  getMyTickets(status: ChatStatus, offset: Int, limit: Int): HealthChatList!
  getMyTicket(chatId: ID!): HealthChat
  getTicketMessages(chatId: ID!, offset: Int, limit: Int): [HealthChatPrompt!]!
}

# Medical-only queries
type MedicalQuery {
  getPendingTickets(location: Designation, offset: Int, limit: Int): HealthChatList!
  getActiveTickets(location: Designation, offset: Int, limit: Int): HealthChatList!
  getAllTickets(location: Designation, status: ChatStatus, offset: Int, limit: Int): HealthChatList!
  getTicket(chatId: ID!): HealthChat
  getMessages(chatId: ID!, offset: Int, limit: Int): [HealthChatPrompt!]!
  getPatientConversations(location: Designation, statuses: [ChatStatus], offset: Int, limit: Int): PatientConversationList!
  getPatientMessages(patientId: Int!, offset: Int, limit: Int, before: String): [HealthChatPrompt!]!
}

# Unified queries exposed to appropriate role
type Query {
  # Patient queries
  getMyTickets(status: ChatStatus, offset: Int, limit: Int): HealthChatList!
  getMyTicket(chatId: ID!): HealthChat
  getTicketMessages(chatId: ID!, offset: Int, limit: Int): [HealthChatPrompt!]!

  # Medical queries
  getPendingTickets(location: Designation, offset: Int, limit: Int): HealthChatList!
  getActiveTickets(location: Designation, offset: Int, limit: Int): HealthChatList!
  getAllTickets(location: Designation, status: ChatStatus, offset: Int, limit: Int): HealthChatList!
  getTicket(chatId: ID!): HealthChat
  getMessages(chatId: ID!, offset: Int, limit: Int): [HealthChatPrompt!]!
  getPatientConversations(location: Designation, statuses: [ChatStatus], offset: Int, limit: Int): PatientConversationList!
  getPatientMessages(patientId: Int!, offset: Int, limit: Int, before: String): [HealthChatPrompt!]!
}

# Mutations
type Mutation {
  # Patient mutations
  createTicket(input: CreateTicketInput!): TicketResult!
  sendPatientMessage(input: SendMessageInput!): MessageResult!
  closeMyTicket(chatId: ID!): TicketResult!

  # Session extension (available to both patient and medical)
  extendSession(chatId: ID!): TicketResult!

  # Medical mutations
  approveTicket(input: ApproveTicketInput!): TicketResult!
  rejectTicket(chatId: ID!, reason: String): TicketResult!
  sendMedicalMessage(input: SendMessageInput!): MessageResult!
  closeTicket(input: CloseTicketInput!): TicketResult!
  deleteArchivedTicket(chatId: ID!): TicketResult!

  transferTicket(chatId: ID!, toMedicalId: Int!): TicketResult!
  takeoverOngoingTicket(chatId: ID!): TicketResult! # for admin only
  expireOldTickets: Int!
}
