scalar Date
scalar UUID

### ====================== VITAL SIGNS ==================== ###

type VitalSigns {
  id: ID!
  patientId: ID
  height_cm: Float!
  weight_kg: Float!
  blood_pressure: String!
  heart_rate: Int!
  temperature: Float!
  notes: String
  created_at: Date
  archived_at: Date
}

input VitalSignsInput {
  height_cm: Float!
  weight_kg: Float!
  blood_pressure: String!
  heart_rate: Int!
  temperature: Float!
  notes: String
}

input VitalSignsUpdateInput {
  height_cm: Float
  weight_kg: Float
  blood_pressure: String
  heart_rate: Int
  temperature: Float
  notes: String
}

### ====================== DENTAL RECORD ==================== ###

enum DentalLegend {
  PRESENT
  DUE_FILLING_DECAYED
  DUE_EXTRACTION
  ROOT_FRAGMENT
  MISSING_DUE_TO_CARIES
  MISSING_DUE_TO_OTHER_CAUSES
  IMPACTED_TOOTH
  SUPERNUMERARY_TOOTH
  UNERUPTED
  ECTOPIC_ERUPTION
  DIASTEMA
  ROTATED
  FRACTURE
  ABRADED
  ATTRITION
  MOBILITY
  AMALGAM_FILLING
  COMPOSITE_FILLING
  GOLD_FILLING
  INLAY_FILLING
  CEMENTED_CROWN
  BRIDGE_ABUTMENT
  PONTIC
  ROOT_CANAL
  EXTRACTION
  JACKET_CROWN
}

type ToothPlacement {
  id: ID!
  toothIndex: Int!
  legend: DentalLegend!
}

input ToothPlacementInput {
  toothIndex: Int!
  legend: DentalLegend!
}

### ====================== ORAL FINDING CATALOG ==================== ###

type OralFindingCatalog {
  id: ID!
  name: String!
  isActive: Boolean!
  description: String
  created_at: Date
}

input OralFindingCatalogInput {
  name: String!
  isActive: Boolean
  description: String
}

type OralFindingRecord {
  oralFindingId: ID!
  status: String!
  notes: String
}

input OralFindingRecordInput {
  oralFindingId: ID!
  status: String!
  notes: String
}

type DentalRecord {
  id: ID!
  patientId: ID
  notes: String
  oralFindings: [OralFindingRecord!]!
  ToothPlacements: [ToothPlacement!]!
  created_at: Date
}

input DentalRecordInput {
  notes: String
  oralFindings: [OralFindingRecordInput!]!
  ToothPlacements: [ToothPlacementInput!]!
}

### ====================== QUERIES ==================== ###

type Query {
  # Get VitalSigns for a patient
  getPatientVitalSigns(patientId: ID!, limit: Int, offset: Int): [VitalSigns!]!

  # Get DentalRecord for a patient
  getPatientDentalRecord(patientId: ID!, limit: Int, offset: Int): [DentalRecord!]!

  # Get specific VitalSigns by ID
  getVitalSignsById(id: ID!): VitalSigns

  # Get specific DentalRecord by ID
  getDentalRecordById(id: ID!): DentalRecord

  # Get all OralFindingCatalogs
  getOralFindingCatalogs(filterIsValid: Boolean, offset: Int, limit: Int): [OralFindingCatalog!]!
}

### ====================== MUTATIONS ==================== ###

type Mutation {
  # Create standalone VitalSigns
  createVitalSigns(patientId: ID!, input: VitalSignsInput!): VitalSigns!

  # Create standalone DentalRecord
  createDentalRecord(patientId: ID!, input: DentalRecordInput!): DentalRecord!

  # Update existing VitalSigns (only allowed within 1 day of creation)
  updateVitalSigns(id: ID!, input: VitalSignsUpdateInput!): VitalSigns!

  # Update existing DentalRecord (only allowed within 1 day of creation)
  updateDentalRecord(id: ID!, input: DentalRecordInput!): DentalRecord!

  # Create OralFindingCatalog
  createOralFindingCatalog(input: OralFindingCatalogInput!): OralFindingCatalog!

  # Update OralFindingCatalog
  updateOralFindingCatalog(id: ID!, input: OralFindingCatalogInput!): OralFindingCatalog!

  # Delete OralFindingCatalog
  deleteOralFindingCatalog(id: ID!): OralFindingCatalog!
}
