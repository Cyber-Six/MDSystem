scalar Date

# ─── ENUMS ─────────────────────────────────────────────────────────────────────

enum StaffRole {
  Doctor
  Nurse
  Admin
  Pharmacist
  Dentist
  Staff
}

enum Designation {
  Manila
  QuezonCity
  Both
}

enum AccountStatus {
  Active
  Suspended
  Pending
}

enum CredentialsStatus {
  Active
  Unverified
  Suspended
}

enum Identity {
  Medical
  Employee
  Student
  Superior
}

# ─── TYPES ─────────────────────────────────────────────────────────────────────

type UserInfo {
  email: String!
  identity: Identity!
  credentialsStatus: CredentialsStatus!
  name: String!
}

type MedicalPersonnel {
  id: ID!
  role: StaffRole
  title: String
  designation: Designation
  isActive: Boolean
  user: UserInfo
}

type Permissions {
  is_admin: Boolean!
  is_staff: Boolean!
  privileged_to_perform_on_superior: Boolean!
  emr_allow_approval: Boolean!
  emr_allow_edit: Boolean!
  emr_allow_view: Boolean!
  emr_allow_set_dental_record: Boolean!
  emr_allow_edit_catalogs: Boolean!
  profile_allow_approval: Boolean!
  profile_allow_view: Boolean!
  profile_allow_edit: Boolean!
  profile_allow_update_email_identifier: Boolean!
  appointment_allow_approval: Boolean!
  appointment_allow_view_records: Boolean!
  appointment_allow_view_configuration: Boolean!
  appointment_allow_edit_configuration: Boolean!
  announcement_allow_crud: Boolean!
  consultation_allow_view: Boolean!
  consultation_allow_edit: Boolean!
  inventory_allow_view: Boolean!
  inventory_allow_dispense: Boolean!
  inventory_allow_edit: Boolean!
  inventory_allow_manage_requests: Boolean!
  inventory_allow_prescribe: Boolean!
  medicine_request_allow_approve: Boolean!
}

# Permission with branch information
type PermissionWithBranch {
  key: String!           # Permission key (e.g., "emr_allow_view")
  label: String!         # Permission label (e.g., "ALLOW_TO_VIEW_EMR")
  enabled: Boolean!      # Whether permission is granted
  branch: Designation    # Branch for this permission (null if not granted)
}

# Staff permissions with branch info (returned by getStaffPermissions)
type StaffPermissions {
  permissions: [PermissionWithBranch!]!
  count: Int!
}

type StaffAccount {
  id: ID!
  email: String!
  name: String!
  branch: Designation
  identity: Identity!
  status: AccountStatus!
  permissions: Permissions!
  credentialsStatus: CredentialsStatus
  lastLogin: String
}

type StaffAccountList {
  staff: [StaffAccount!]!
  count: Int!
}

type MedicalPersonnelList {
  personnel: [MedicalPersonnel!]!
  count: Int!
}

type MutationResult {
  ok: Boolean!
  message: String!
}

type StaffAccountMutationResult {
  ok: Boolean!
  message: String!
}

type MedicalPersonnelMutationResult {
  ok: Boolean!
  message: String!
  personnel: MedicalPersonnel
}

type DeleteMedicalPersonnelResult {
  ok: Boolean!
  message: String!
  identityReverted: Boolean!
}

# ─── SESSION MANAGEMENT TYPES ──────────────────────────────────────────────────

type StaffSession {
  deviceId: String!
  status: String!
  createdAt: String!
  updatedAt: String
  expiresAt: String
  isCurrent: Boolean!
}

type StaffSessionList {
  sessions: [StaffSession!]!
  count: Int!
  currentAnchor: String
}

type RotateAnchorResult {
  ok: Boolean!
  message: String!
  sessionsInvalidated: Int!
}

# User session info for paginated listing
type UserSession {
  userId: ID!
  email: String!
  role: String!
  exp: Float!
}

# Paginated user sessions response
type UserSessionPage {
  sessions: [UserSession!]!
  totalCount: Int!
}

# ─── INPUT TYPES ───────────────────────────────────────────────────────────────

input CreateMedicalPersonnelInput {
  userId: ID!
  title: String!
  role: StaffRole!
  designation: Designation!
}

input UpdateMedicalPersonnelInput {
  title: String
  designation: Designation
  isActive: Boolean
}

# Individual permission with optional branch (for extended mutation)
input ExtendedPermissionInput {
  key: String!          # Permission key (e.g., "emr_allow_view")
  enabled: Boolean!     # true = grant, false = revoke (removes database record)
  branch: Designation   # Optional: Manila, QuezonCity, or Both (uses defaultBranch if not specified)
}

# Standard permission input (no branch - uses umbrella branch)
input StandardPermissionInput {
  key: String!          # Permission key (e.g., "emr_allow_view")
  enabled: Boolean!     # true = grant, false = revoke (removes database record)
}

# ─── QUERIES ───────────────────────────────────────────────────────────────────

type Query {
  # Staff Accounts
  listStaffAccounts(status: CredentialsStatus, location: Designation): StaffAccountList!
  getStaffAccount(userId: ID!): StaffAccount

  # Medical Personnel
  listMedicalPersonnel(role: StaffRole, designation: Designation, isActive: Boolean): MedicalPersonnelList!
  getMedicalPersonnel(userId: ID!): MedicalPersonnel

  # Permissions - Returns all permissions with enabled status AND branch designation
  getStaffPermissions(userId: ID!): StaffPermissions!

  # Session Management
  listStaffSessions(userId: ID!): StaffSessionList!

  # Refresh Token Analytics
  countActiveRefreshTokens: Int!
  listUserSessions(offset: Int!, limit: Int!): UserSessionPage!
}

# ─── MUTATIONS ─────────────────────────────────────────────────────────────────

type Mutation {
  # Medical Personnel
  createMedicalPersonnel(input: CreateMedicalPersonnelInput!): MedicalPersonnelMutationResult!
  updateMedicalPersonnel(userId: ID!, input: UpdateMedicalPersonnelInput!): MedicalPersonnelMutationResult!
  deleteMedicalPersonnel(userId: ID!, revertIdentity: Boolean): DeleteMedicalPersonnelResult!

  # Permissions - Standard (umbrella branch for all permissions)
  # Use this when all permissions should have the same branch designation.
  # The 'branch' parameter is applied to ALL permissions being set.
  # Example: setStaffPermissionsStandard(userId: "1", permissions: [{key: "emr_allow_view", value: true}], branch: Manila)
  setStaffPermissionsStandard(userId: ID!, permissions: [StandardPermissionInput!]!, branch: Designation!): MutationResult!

  # Permissions - Extended (independent branch per permission)
  # Use this when each permission needs its own branch designation.
  # If a permission doesn't specify a branch, 'defaultBranch' is used (defaults to 'Both').
  # Example: setStaffPermissionsExtended(userId: "1", permissions: [{key: "emr_allow_view", enabled: true, branch: Manila}, {key: "profile_allow_view", enabled: true, branch: QuezonCity}])
  setStaffPermissionsExtended(userId: ID!, permissions: [ExtendedPermissionInput!]!, defaultBranch: Designation): MutationResult!

  # Session Management
  rotateStaffAnchor(userId: ID!): RotateAnchorResult!
}
