scalar Date

# ─── ENUMS ─────────────────────────────────────────────────────────────────────

enum StaffRole {
  Doctor
  Nurse
  Admin
  Pharmacist
  Dentist
  Staff
}

enum Designation {
  Manila
  QuezonCity
  Both
}

enum AccountStatus {
  Active
  Suspended
  Pending
}

enum CredentialsStatus {
  Active
  Unverified
  Suspended
}

enum Identity {
  Medical
  Employee
  Student
  Superior
}

# ─── TYPES ─────────────────────────────────────────────────────────────────────

type UserInfo {
  email: String!
  identity: Identity!
  credentialsStatus: CredentialsStatus!
  name: String!
}

type MedicalPersonnel {
  id: ID!
  role: StaffRole
  title: String
  designation: Designation
  isActive: Boolean
  user: UserInfo
}

# ─── PERMISSION TYPES ──────────────────────────────────────────────────────────

# Reusable permission type with branch information
# Represents a single permission with its enabled status and branch designation
# Used consistently across staff permissions, templates, and accounts
type BranchPermission {
  key: String!           # Permission key (e.g., "emr_allow_view")
  label: String!         # Permission label (e.g., "ALLOW_TO_VIEW_EMR")
  enabled: Boolean!      # Whether permission is granted (true = exists in database, false = no record)
  branch: Designation    # Branch for this permission (null if not granted)
}

# Staff permissions wrapper type - array of BranchPermission
# Returned by getStaffPermissions query and stored in StaffAccount
# Unified format across all permission queries and mutations
type Permissions {
  permissions: [BranchPermission!]!
  count: Int!
}

# Staff permissions with branch info (returned by getStaffPermissions query)
# Identical structure to Permissions type for consistency
type StaffPermissions {
  permissions: [BranchPermission!]!
  count: Int!
}

# ─── TEMPLATE TYPES ────────────────────────────────────────────────────────────

# Permission template for reusable permission sets
type PermissionTemplate {
  id: ID!
  label: String!
  createdBy: ID!
  createdAt: String!
  permissions: [BranchPermission!]!
  permissionCount: Int!
}

# List of permission templates
type PermissionTemplateList {
  templates: [PermissionTemplate!]!
  count: Int!
}

type StaffAccount {
  id: ID!
  email: String!
  name: String!
  branch: Designation
  identity: Identity!
  status: AccountStatus!
  permissions: Permissions!                    # Array of BranchPermission objects with enabled status and branch
  credentialsStatus: CredentialsStatus
  lastLogin: String
}

type StaffAccountList {
  staff: [StaffAccount!]!
  count: Int!
}

type MedicalPersonnelList {
  personnel: [MedicalPersonnel!]!
  count: Int!
}

type MutationResult {
  ok: Boolean!
  message: String!
}

type StaffAccountMutationResult {
  ok: Boolean!
  message: String!
}

type MedicalPersonnelMutationResult {
  ok: Boolean!
  message: String!
  personnel: MedicalPersonnel
}

type DeleteMedicalPersonnelResult {
  ok: Boolean!
  message: String!
  identityReverted: Boolean!
}

# ─── SESSION MANAGEMENT TYPES ──────────────────────────────────────────────────

type StaffSession {
  deviceId: String!
  status: String!
  createdAt: String!
  updatedAt: String
  expiresAt: String
  isCurrent: Boolean!
}

type StaffSessionList {
  sessions: [StaffSession!]!
  count: Int!
  currentAnchor: String
}

type RotateAnchorResult {
  ok: Boolean!
  message: String!
  sessionsInvalidated: Int!
}

# Admin transfer result type
type InitiateAdminTransferResult {
  ok: Boolean!
  message: String!
  verificationRequired: Boolean!
}

type ConfirmAdminTransferResult {
  ok: Boolean!
  message: String!
  oldAdminId: ID
  newAdminId: ID
}

# User session info for paginated listing
type UserSession {
  userId: ID!
  email: String!
  role: String!
  exp: Float!
}

# Paginated user sessions response
type UserSessionPage {
  sessions: [UserSession!]!
  totalCount: Int!
}

# ─── INPUT TYPES ───────────────────────────────────────────────────────────────

input CreateMedicalPersonnelInput {
  userId: ID!
  title: String!
  role: StaffRole!
  designation: Designation!
}

input UpdateMedicalPersonnelInput {
  title: String
  designation: Designation
  isActive: Boolean
}

# Individual permission with optional branch (for extended mutation)
input ExtendedPermissionInput {
  key: String!          # Permission key (e.g., "emr_allow_view")
  enabled: Boolean!     # true = grant, false = revoke (removes database record)
  branch: Designation   # Optional: Manila, QuezonCity, or Both (uses defaultBranch if not specified)
}

# Standard permission input (no branch - uses umbrella branch)
input StandardPermissionInput {
  key: String!          # Permission key (e.g., "emr_allow_view")
  enabled: Boolean!     # true = grant, false = revoke (removes database record)
}

# ─── TEMPLATE INPUT TYPES ──────────────────────────────────────────────────────

# Input for creating a permission template
input CreateTemplateInput {
  label: String!                         # Template name/label
  permissions: [ExtendedPermissionInput!]!  # Permissions with branch
  defaultBranch: Designation             # Default branch if not specified per permission
}

# Input for updating a permission template
input UpdateTemplateInput {
  label: String                          # Optional: new template name/label
  permissions: [ExtendedPermissionInput!] # Optional: updated permissions
  defaultBranch: Designation             # Optional: default branch for permissions without branch
}

# Result type for template mutations
type TemplateMutationResult {
  ok: Boolean!
  message: String!
  template: PermissionTemplate
}

# ─── QUERIES ───────────────────────────────────────────────────────────────────

type Query {
  # Staff Accounts
  listStaffAccounts(status: CredentialsStatus, location: Designation): StaffAccountList!
  getStaffAccount(userId: ID!): StaffAccount

  # Medical Personnel
  listMedicalPersonnel(role: StaffRole, designation: Designation, isActive: Boolean): MedicalPersonnelList!
  getMedicalPersonnel(userId: ID!): MedicalPersonnel

  # Permissions - Returns all permissions with enabled status AND branch designation
  getStaffPermissions(userId: ID!): StaffPermissions!

  # Session Management
  listStaffSessions(userId: ID!): StaffSessionList!

  # Refresh Token Analytics
  countActiveRefreshTokens: Int!
  listUserSessions(offset: Int!, limit: Int!): UserSessionPage!

  # Permission Templates
  listPermissionTemplates: PermissionTemplateList!
  getPermissionTemplate(templateId: ID!): PermissionTemplate
}

# ─── MUTATIONS ─────────────────────────────────────────────────────────────────

type Mutation {
  # Medical Personnel
  createMedicalPersonnel(input: CreateMedicalPersonnelInput!): MedicalPersonnelMutationResult!
  updateMedicalPersonnel(userId: ID!, input: UpdateMedicalPersonnelInput!): MedicalPersonnelMutationResult!
  deleteMedicalPersonnel(userId: ID!, revertIdentity: Boolean): DeleteMedicalPersonnelResult!

  # Permissions - Standard (umbrella branch for all permissions)
  # Use this when all permissions should have the same branch designation.
  # The 'branch' parameter is applied to ALL permissions being set.
  # Example: setStaffPermissionsStandard(userId: "1", permissions: [{key: "emr_allow_view", value: true}], branch: Manila)
  setStaffPermissionsStandard(userId: ID!, permissions: [StandardPermissionInput!]!, branch: Designation!): MutationResult!

  # Permissions - Extended (independent branch per permission)
  # Use this when each permission needs its own branch designation.
  # If a permission doesn't specify a branch, 'defaultBranch' is used (defaults to 'Both').
  # Example: setStaffPermissionsExtended(userId: "1", permissions: [{key: "emr_allow_view", enabled: true, branch: Manila}, {key: "profile_allow_view", enabled: true, branch: QuezonCity}])
  setStaffPermissionsExtended(userId: ID!, permissions: [ExtendedPermissionInput!]!, defaultBranch: Designation): MutationResult!

  # Session Management
  rotateStaffAnchor(userId: ID!): RotateAnchorResult!

  # Permission Templates
  createPermissionTemplate(input: CreateTemplateInput!): TemplateMutationResult!
  updatePermissionTemplate(templateId: ID!, input: UpdateTemplateInput!): TemplateMutationResult!
  deletePermissionTemplate(templateId: ID!): MutationResult!

  # Apply template to staff (copies template permissions to staff)
  applyTemplateToStaff(userId: ID!, templateId: ID!): MutationResult!

  # Admin Transfer - Initiate the transfer process (requires password re-authentication)
  initiateAdminTransfer(newAdminUserId: ID!, password: String!): InitiateAdminTransferResult!

  # Admin Transfer - Confirm with verification token
  confirmAdminTransfer(verificationToken: String!): ConfirmAdminTransferResult!
}
