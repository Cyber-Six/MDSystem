<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Preview</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <style>
        {styles}
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📄 Document Preview</h1>
            <p>Name: <strong>{name}</strong></p>
            <div class="controls">
                <button class="btn btn-download" onclick="downloadDocx()">⬇ Download DOCX</button>
                <button class="btn btn-back" onclick="window.history.back()">← Back</button>
                <button class="btn btn-print" onclick="printPreview()">🖨 Print Preview</button>
            </div>
        </div>
        
        <div class="error" id="error"></div>
        
        <div class="preview-container">
            <div class="preview-title">📋 Document Preview</div>
            <div class="loading" id="loading">
                <div class="spinner"></div>
            </div>
            <div id="docxPreview"></div>
        </div>
    </div>

    <script>
        {script}
        
        function printPreview() {
            window.print();
        }
    </script>
    <style media="print">
        .controls { display: none; }
        .container { margin: 0; padding: 0; }
    </style>
</body>
</html>
